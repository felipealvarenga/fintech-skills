name: Dispute a grade in a published run
description: An expectation in evals/results/<run>/ was marked passed or failed and the transcript says otherwise.
labels: [evals]
body:
  - type: input
    id: run
    attributes:
      label: Run
      description: The folder name under evals/results/.
      placeholder: 20261109T103432Z-fa81209
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Skill, eval and condition
      placeholder: brazil-payment-rails, eval 3, with
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Expectation and verdict
      description: Copy the expectation text and the grader's evidence from evals/results/<run>/skills/<skill>.json.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the verdict is wrong
      description: Quote the transcript or the file the agent wrote. The raw transcripts are in the raw-<run>.tar.gz attached to the release; the final answer is in the same skills/<skill>.json.
    validations:
      required: true
