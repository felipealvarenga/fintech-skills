name: Propose a rule or a skill
description: A failure you have seen agents make with money code that no skill covers yet.
labels: [proposal]
body:
  - type: textarea
    id: failure
    attributes:
      label: The failure
      description: What the agent wrote and what broke or would break in production.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it belongs
      options:
        - fintech-audit
        - money-arithmetic
        - double-entry-ledger
        - idempotent-payments
        - webhook-handling
        - reconciliation
        - accounting-sync
        - transaction-classification
        - pii-and-card-data
        - audit-trail
        - interest-and-amortization
        - brazil-payment-rails
        - money-tests
        - a new skill
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The testable rule and the vector that would catch it
      description: One rule the agent can follow and a test that fails without it. See CONTRIBUTING.md for the bar.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: It is engineering practice, not tax, accounting or legal advice.
          required: true
        - label: It is not vendor API mechanics; those belong to the vendor's own plugin.
          required: true
