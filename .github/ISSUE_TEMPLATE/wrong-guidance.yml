name: Wrong guidance or a failing vector
description: A skill told the agent something wrong, or a vector fails against a correct implementation.
labels: [bug]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - fintech-audit
        - money-arithmetic
        - double-entry-ledger
        - idempotent-payments
        - webhook-handling
        - reconciliation
        - accounting-sync
        - transaction-classification
        - pii-and-card-data
        - audit-trail
        - interest-and-amortization
        - brazil-payment-rails
        - money-tests
        - other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What the skill said or did
      description: Quote the rule, checklist line or vector. For a vector, paste the failing assertion and the implementation it ran against.
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What is right, and the source
      description: The correct behaviour and where it comes from (a spec, a regulator document, processor docs, a production incident). Rules here must be testable, so say how a test would tell the two apart.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: Claude Code 2.1.319, claude-sonnet-5-5
